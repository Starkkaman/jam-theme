# JamBoard: Saul Bass inspired theme (flat colour, square corners, heavy uppercase display type).
# Pairs with the Jam Cards suite (https://github.com/Starkkaman/jam-cards), which reads the --jam-* variables below
# and loads the fonts (Londrina Solid + Jost). Without Jam Cards installed the fonts fall back to Arial/Impact.
# Dark mode = "ink" (#141210 ground, paper text); light mode = "paper" (#ece2c9 ground, ink text).
JamBoard:
  # ---- shape + type (both modes) ----
  ha-card-border-radius: "0px"
  ha-card-box-shadow: "none"
  ha-card-border-width: "0px"
  ha-dialog-border-radius: "0px"
  ha-section-border-radius: "0px"
  ha-badge-border-radius: "0px"
  ha-border-radius-sm: "0px"
  ha-border-radius-md: "0px"
  ha-border-radius-lg: "0px"
  ha-border-radius-xl: "0px"
  ha-border-radius-pill: "0px"
  mdc-shape-small: "0px"
  mdc-shape-medium: "0px"
  mdc-shape-large: "0px"
  ha-tile-border-radius: "0px"
  ha-font-family-body: '"Jost", "Helvetica Neue", Arial, sans-serif'
  ha-font-family-heading: '"Londrina Solid", "Arial Black", Impact, sans-serif'
  primary-font-family: '"Jost", "Helvetica Neue", Arial, sans-serif'
  paper-font-common-base_-_font-family: '"Jost", "Helvetica Neue", Arial, sans-serif'
  paper-font-common-code_-_font-family: '"JetBrains Mono", Menlo, monospace'
  mdc-typography-font-family: '"Jost", "Helvetica Neue", Arial, sans-serif'
  jam-display: '"Londrina Solid", "Arial Black", Impact, sans-serif'
  jam-body: '"Jost", "Helvetica Neue", Arial, sans-serif'

  modes:
    dark:
      # Jam Cards palette
      jam-ink: "#141210"
      jam-slab: "#1f1c19"
      jam-slab2: "#2a2622"
      jam-paper: "#ece2c9"
      jam-paper-fg: "#141210"
      jam-paper-dim: "#5c5446"
      jam-fg: "#ece2c9"
      jam-dim: "#9a8f7c"
      jam-line: "#34302a"
      jam-ochre: "#e5a31b"
      jam-red: "#d43a1c"
      jam-teal: "#3f9aa5"
      # Home Assistant
      primary-color: "#e5a31b"
      accent-color: "#d43a1c"
      rgb-primary-color: "229, 163, 27"
      rgb-accent-color: "212, 58, 28"
      text-primary-color: "#141210"
      text-accent-color: "#ece2c9"
      primary-background-color: "#141210"
      secondary-background-color: "#1f1c19"
      lovelace-background: "#141210"
      card-background-color: "#1f1c19"
      ha-card-background: "#1f1c19"
      ha-dialog-surface-background: "#1f1c19"
      primary-text-color: "#ece2c9"
      secondary-text-color: "#9a8f7c"
      disabled-text-color: "#5c5446"
      rgb-primary-text-color: "236, 226, 201"
      divider-color: "#34302a"
      outline-color: "#34302a"
      state-icon-color: "#9a8f7c"
      state-active-color: "#e5a31b"
      state-inactive-color: "#5c5446"
      state-on-color: "#e5a31b"
      state-off-color: "#5c5446"
